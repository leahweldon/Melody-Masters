name: Quality checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game logic
        run: npm test
      - name: Validate source files and documentation
        run: npm run check
      - name: Build static website
        run: npm run build
